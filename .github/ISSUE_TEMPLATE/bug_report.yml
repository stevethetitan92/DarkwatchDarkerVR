name: Darkwatch Darker VR bug report
description: Report a problem with the Darkwatch Darker VR mod or VR launcher.
title: "[VR Bug] "
body:
  - type: markdown
    attributes:
      value: |
        This form files an issue in DarkwatchDarkerVR. Please check [existing VR issues](https://github.com/stevethetitan92/DarkwatchDarkerVR/issues) first.
        Reports are public. Review logs for personal information before attaching them, and do not upload ISOs or game files.
  - type: input
    id: version
    attributes:
      label: VR launcher and game build
      description: Include the launcher version and the VR game build or test build name, if known.
      placeholder: e.g. launcher 0.7.8-vr2, VR game build 0.7.6
    validations:
      required: true
  - type: input
    id: vr_setup
    attributes:
      label: Headset and OpenXR setup
      description: Include your headset, active OpenXR runtime, and how the headset connects to the PC.
      placeholder: e.g. Quest 3, VirtualDesktopXR, wireless Virtual Desktop
  - type: input
    id: system
    attributes:
      label: System details
      description: If known, include your Windows version and GPU.
      placeholder: e.g. Windows 11, RTX 4070
  - type: dropdown
    id: installation
    attributes:
      label: How was this version installed?
      options:
        - Fresh installation
        - Launcher-only bundle update
        - Manually merged or copied files
        - Other / not sure
  - type: input
    id: update_details
    attributes:
      label: Installation or update details
      description: If relevant, give the previous version, whether the same folder was used, and whether you use the ISO directly or imported files. A full personal folder path is not needed.
  - type: input
    id: input
    attributes:
      label: VR controllers
      description: For input or tracking issues, include the controller model and whether both controllers were tracked when the issue occurred.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us how to reach the problem, including the chapter or menu where it happens.
      placeholder: |
        1. Start...
        2. Select...
        3. The problem happens when...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happens instead and whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings
      description: If relevant, include the weapon, camera mode, headset refresh rate, HD textures, or other settings involved.
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots or video
      description: Optional. Attach a screenshot, video or logs from an affected session. If using the launcher's opt-in diagnostics, enable them before reproducing the problem. Do not paste passwords or other private information.
